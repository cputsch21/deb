# The enforcement must not depend on anyone remembering anything.
#
# `pnpm test` is `tsc -b && vitest run`, and the typecheck half is the
# load-bearing one: src/db/proof.compile-test.tsx guards the EMPTINESS
# MUST BE EARNED capability removals with @ts-expect-error directives, so
# a green vitest run alone can hide a dead law (DECISIONS, July 31).
#
# Before this existed, nothing ran either half until Vercel built the
# push — which fails the DEPLOY, after the code is already on main. This
# fails the BUILD, which is a different and much stronger guarantee.
#
# One job, one command, by ruling. No matrix, no cache, no deploy steps.
# It needs no secrets: the suite is pure logic and passes with no .env
# present (verified before this file was written).

# Action majors pinned July 31 2026. The v4 line targeted the Node 20
# runtime, which GitHub deprecated and was already force-running on 24 —
# a CI that will break with no code change attached is a trap, so it was
# pinned forward rather than left to expire. Re-check when a warning
# reappears in the run log.
name: CI

on:
  push:
    # archived branches are archived BECAUSE they are broken against the
    # current tree; a permanently red X trains a person to stop reading
    # the tab, which costs more than it saves. Not machinery — the job
    # knowing what it is for.
    branches-ignore:
      - 'abandoned/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # pinned to the version that wrote pnpm-lock.yaml (v9 lockfile);
          # --frozen-lockfile is only honest if the resolver matches
          version: 10.33.4

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # matches Vercel's production runtime

      # A CHECK THAT CANNOT FAIL A PUSH IS DECORATION (law, Aug 3 2026).
      # `pnpm test` is tsc -b + vitest; `pnpm lint` is oxlint, which carries
      # the api/_lib/anchor.ts import ban. The rule was verified to fire and
      # exit 1 — and then ran nowhere, which made it a decoration. Wired.
      # A CHECK THAT CANNOT FAIL A PUSH IS DECORATION. `pnpm build` is the
      # BUNDLER, not just the typecheck — without it main can carry a
      # broken bundle and we learn from a failed Vercel deploy, after the
      # fact. tsc -b is incremental, so the second run of it is ~free and
      # the real cost is vite alone (~4s locally).
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm lint && pnpm build
