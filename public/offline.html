<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Deb</title>
<style>
  :root { --bg:#faf8f4; --ink:#2b2823; --muted:#6e6a61; --dim:#8c8579; --fill2:rgba(43,40,35,0.07); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191713; --ink:#ede9e1; --muted:#b5afa4; --dim:#9c958a; --fill2:rgba(255,255,255,0.09); }
  }
  html,body { height:100%; margin:0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    -webkit-font-smoothing: antialiased;
  }
  .eb { font-family: "JetBrains Mono", ui-monospace, monospace; font-size:.68rem;
    letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  h1 { font-family: Fraunces, Georgia, serif; font-weight:500; font-size:24px; margin:10px 0 6px; }
  p { color:var(--muted); font-size:14px; margin:0 0 22px; }
  button { font:inherit; color:var(--ink); background:var(--fill2); border:none;
    border-radius:12px; padding:11px 20px; cursor:pointer; min-height:44px; }
</style>
</head>
<body>
  <main>
    <div class="eb">Deb</div>
    <h1>Deb needs a connection.</h1>
    <p>Nothing is lost — the record is safe on the server.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
